  /* one deliberate visual world: a sunlit oak desk; the scene fills the screen,
     the only chrome is the hint line, the save button and the loading paper */
  :root {
    --paper: #ece3d1;          /* the blank paper the opening starts from (WebGL draws the same colour) */
    --desk: #2b2219;
    --ink: #3a4232;
    --hint: rgba(255, 247, 232, 0.92);
    --serif: "Card Serif", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
    color-scheme: light;
  }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; opacity: 0; }
  canvas#gl.live { opacity: 1; }
  canvas#gl:focus-visible { outline: 2px solid var(--hint); outline-offset: -8px; }
  #grade {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 42% 40%, rgba(255, 236, 205, 0) 52%, rgba(44, 30, 18, 0.30) 100%);
    mix-blend-mode: multiply;
  }

  /* first moment: start in the dark tone of the page around the card, and let
     the light come up onto the blank paper */
  #dawn {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: #1a1a19;
    animation: dawn 1.3s cubic-bezier(0.4, 0, 0.2, 1) 0.05s forwards;
  }
  @keyframes dawn { to { opacity: 0; visibility: hidden; } }

  /* loading: a hairline on the blank paper while the paintings arrive */
  #progress {
    position: fixed; left: 50%; z-index: 2;
    bottom: calc(max(30px, env(safe-area-inset-bottom, 0px)) + 4px);
    width: 120px; height: 1px; margin-left: -60px;
    background: rgba(90, 76, 54, 0.14); overflow: hidden;
    transition: opacity 1.2s ease;
  }
  #progress i { display: block; height: 100%; width: 0; background: rgba(90, 76, 54, 0.5); transition: width 0.5s ease; }
  #progress.done { opacity: 0; }

  #hint {
    position: fixed; left: 0; right: 0; z-index: 2;
    bottom: max(22px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center; pointer-events: none;
    font: 300 14px/1.6 var(--serif); letter-spacing: 0.34em; text-indent: 0.34em;
    color: var(--hint); text-shadow: 0 0 1px rgba(30, 20, 10, 0.35), 0 1px 12px rgba(30, 20, 10, 0.6);
    opacity: 0; transition: opacity 1.8s ease;
  }
  #hint.show { opacity: 1; }

  #save {
    position: fixed; z-index: 2;
    right: calc(max(16px, env(safe-area-inset-right, 0px)) + 2px);
    bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 1px);
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px 9px 12px; border-radius: 999px;
    font: 300 13.5px/1 var(--serif); letter-spacing: 0.2em;
    color: var(--ink); background: rgba(246, 240, 228, 0.88);
    border: 1px solid rgba(58, 66, 50, 0.16);
    box-shadow: 0 6px 18px rgba(30, 20, 10, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.8s ease, transform 0.8s ease, background-color 0.2s ease;
    cursor: pointer; touch-action: manipulation;
  }
  #save.show { opacity: 1; transform: none; }
  #save:hover { background: rgba(252, 248, 238, 0.97); }
  #save:disabled { cursor: progress; }
  #save:focus-visible { outline: 2px solid var(--hint); outline-offset: 3px; }
  #save svg { width: 15px; height: 15px; flex: none; }
  /* narrow screens: the button sits above the centred hint instead of beside it */
  @media (max-width: 560px) {
    #save { bottom: calc(max(22px, env(safe-area-inset-bottom, 0px)) + 36px); }
  }

  /* iOS lets a page read the phone's tilt only once a tap has asked, so the
     opening offers that tap; any tap anywhere does the same */
  #motion {
    position: fixed; left: 50%; z-index: 6;
    bottom: calc(max(30px, env(safe-area-inset-bottom, 0px)) + 34px);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px 9px 13px; border-radius: 999px; white-space: nowrap;
    font: 300 13.5px/1 var(--serif); letter-spacing: 0.2em;
    color: var(--ink); background: rgba(246, 240, 228, 0.9);
    border: 1px solid rgba(58, 66, 50, 0.16);
    box-shadow: 0 6px 18px rgba(30, 20, 10, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transform: translate(-50%, 8px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    cursor: pointer; touch-action: manipulation;
  }
  #motion.show { opacity: 1; transform: translate(-50%, 0); }
  #motion svg { width: 16px; height: 16px; flex: none; }

  #fallback {
    position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
    background: var(--desk);
  }
  #fallback img { max-width: 92vw; max-height: 86vh; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
  @media (prefers-reduced-motion: reduce) {
    #progress, #hint, #save, #motion { transition-duration: 0.3s; }
    #dawn { animation-duration: 0.4s; }
  }
</style>

<canvas id="gl" tabindex="0" aria-label="立体水彩贺卡：移动鼠标或倾斜手机查看层次；拖动或滑动翻面，方向键也可翻面；滚轮或双指缩放"></canvas>
<div id="grade"></div>
<div id="hint" aria-hidden="true"></div>
<button id="save" type="button" hidden>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v7.5"/><path d="M4.8 7.2 8 10.4l3.2-3.2"/><path d="M3 12.8h10"/></svg>
  <span>保存贺卡</span>
</button>
<div id="progress" aria-hidden="true"><i></i></div>
<div id="dawn" aria-hidden="true"></div>
<button id="motion" type="button" hidden>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.6" y="2.4" width="4.8" height="11.2" rx="1.1" transform="rotate(-14 8 8)"/><path d="M2.7 5.6a6.2 6.2 0 0 0 0 4.8"/><path d="M13.3 5.6a6.2 6.2 0 0 1 0 4.8"/></svg>
  <span>轻触开启重力感应</span>
</button>
<div id="fallback" hidden><img src="preview.jpg" alt="Happy Wedding · 孙轶伟 & 赵欣宇 · Oct 25, 2026"></div>
<script>
  // runs before the card itself has loaded, so the very first tap can ask
  (() => {
    const D = window.DeviceOrientationEvent;
    if (typeof D?.requestPermission !== 'function' || !matchMedia('(pointer: coarse)').matches) return;
    const btn = document.getElementById('motion');
    let asked = false, moving = false;
    const hide = () => { btn.classList.remove('show'); setTimeout(() => { btn.hidden = true; }, 900); };
    const ask = () => {
      if (asked) return;
      asked = true; hide();
      D.requestPermission().catch(() => {});
    };
    // a release is the gesture iOS accepts for its dialog
    addEventListener('touchend', ask, { capture: true, passive: true });
    addEventListener('click', ask, true);
    // granted earlier in this visit: readings simply arrive, nothing to ask
    addEventListener('deviceorientation', function seen(e) {
      if (e.beta == null) return;
      moving = true; removeEventListener('deviceorientation', seen);
      if (!asked) hide();
    });
    // inside another page's frame the tilt is never granted: no offer there
    if (window.top !== window) return;
    setTimeout(() => {
      if (asked || moving) return;
      btn.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => btn.classList.add('show')));
    }, 500);
  })();
</script>
<script type="module" src="./main.js"></script>
