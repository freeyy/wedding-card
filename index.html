  /* one deliberate visual world: a sunlit oak desk; the scene fills the screen,
     the only chrome is the hint line, the save button and the loading paper */
  :root {
    --paper: #ece3d1;          /* the blank paper the opening starts from (WebGL draws the same colour) */
    --desk: #2b2219;
    --ink: #3a4232;
    --hint: rgba(255, 247, 232, 0.92);
    --serif: "Card Serif", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
    color-scheme: light;
  }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; opacity: 0; }
  canvas#gl.live { opacity: 1; }
  canvas#gl:focus-visible { outline: 2px solid var(--hint); outline-offset: -8px; }
  #grade {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 42% 40%, rgba(255, 236, 205, 0) 52%, rgba(44, 30, 18, 0.30) 100%);
    mix-blend-mode: multiply;
  }

  /* first moment: start in the dark tone of the page around the card, and let
     the light come up onto the blank paper */
  #dawn {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: #1a1a19;
    animation: dawn 1.3s cubic-bezier(0.4, 0, 0.2, 1) 0.05s forwards;
  }
  @keyframes dawn { to { opacity: 0; visibility: hidden; } }

  /* loading: a hairline on the blank paper while the paintings arrive */
  #progress {
    position: fixed; left: 50%; z-index: 2;
    bottom: calc(max(30px, env(safe-area-inset-bottom, 0px)) + 4px);
    width: 120px; height: 1px; margin-left: -60px;
    background: rgba(90, 76, 54, 0.14); overflow: hidden;
    transition: opacity 1.2s ease;
  }
  #progress i { display: block; height: 100%; width: 0; background: rgba(90, 76, 54, 0.5); transition: width 0.5s ease; }
  #progress.done { opacity: 0; }

  #hint {
    position: fixed; left: 0; right: 0; z-index: 2;
    bottom: max(22px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center; pointer-events: none;
    font: 300 14px/1.6 var(--serif); letter-spacing: 0.34em; text-indent: 0.34em;
    color: var(--hint); text-shadow: 0 0 1px rgba(30, 20, 10, 0.35), 0 1px 12px rgba(30, 20, 10, 0.6);
    opacity: 0; transition: opacity 1.8s ease;
  }
  #hint.show { opacity: 1; }

  #save {
    position: fixed; z-index: 2;
    right: calc(max(16px, env(safe-area-inset-right, 0px)) + 2px);
    bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 1px);
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px 9px 12px; border-radius: 999px;
    font: 300 13.5px/1 var(--serif); letter-spacing: 0.2em;
    color: var(--ink); background: rgba(246, 240, 228, 0.88);
    border: 1px solid rgba(58, 66, 50, 0.16);
    box-shadow: 0 6px 18px rgba(30, 20, 10, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.8s ease, transform 0.8s ease, background-color 0.2s ease;
    cursor: pointer; touch-action: manipulation;
  }
  #save.show { opacity: 1; transform: none; }
  #save:hover { background: rgba(252, 248, 238, 0.97); }
  #save:disabled { cursor: progress; }
  #save:focus-visible { outline: 2px solid var(--hint); outline-offset: 3px; }
  #save svg { width: 15px; height: 15px; flex: none; }
  /* narrow screens: the button sits above the centred hint instead of beside it */
  @media (max-width: 560px) {
    #save { bottom: calc(max(22px, env(safe-area-inset-bottom, 0px)) + 36px); }
  }

  #fallback {
    position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
    background: var(--desk);
  }
  #fallback img { max-width: 92vw; max-height: 86vh; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
  @media (prefers-reduced-motion: reduce) {
    #progress, #hint, #save { transition-duration: 0.3s; }
    #dawn { animation-duration: 0.4s; }
  }
</style>
